<!doctype html><meta charset="utf-8"><title>responsive harness</title>
<style>
  html,body{margin:0;background:#232833;font:11px system-ui;color:#9fb0c8}
  #wrap{display:flex;gap:10px;align-items:flex-start;padding:8px}
  .cell{display:flex;flex-direction:column;gap:4px}
  iframe{border:0;background:#fff;display:block;transform-origin:top left}
  .frame{overflow:hidden}
</style>
<div id="wrap"></div>
<script>
  const p = new URLSearchParams(location.search);
  const w = +(p.get('w')||390), h = +(p.get('h')||844), s = +(p.get('s')||1);
  const ys = (p.get('y')||'0').split(',').map(Number);
  const wrap = document.getElementById('wrap');
  ys.forEach((y) => {
    const cell = document.createElement('div'); cell.className='cell';
    const cap = document.createElement('div'); cap.textContent = w+'px · y '+y;
    const box = document.createElement('div'); box.className='frame';
    box.style.width=(w*s)+'px'; box.style.height=(h*s)+'px';
    const f = document.createElement('iframe');
    f.width=w; f.height=h; f.style.transform='scale('+s+')';
    f.src='http://localhost:3100/';
    f.onload = () => { let n=0; const t=setInterval(()=>{ try{
        const win=f.contentWindow, target=y;
        for(let i=1;i<=6;i++) win.scrollTo(0, target*i/6);
      }catch(e){} if(++n>10) clearInterval(t); }, 200); };
    box.appendChild(f); cell.appendChild(cap); cell.appendChild(box); wrap.appendChild(cell);
  });
</script>
